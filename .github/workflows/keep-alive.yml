name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Render backend /health
        env:
          URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "RENDER_BACKEND_URL secret is not set (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          curl -fsS --max-time 90 --retry 3 --retry-delay 10 "$URL/health"
