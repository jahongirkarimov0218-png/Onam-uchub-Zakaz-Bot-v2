[project]
name = "onam-shop-backend"
version = "0.1.0"
description = "Onam Shop backend (FastAPI + aiogram)"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "aiogram>=3",
  "sqlalchemy[asyncio]>=2",
  "aiosqlite",
  "alembic",
  "pydantic-settings",
  "apscheduler>=3,<4",
  "python-multipart",
  "tzdata",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "httpx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
